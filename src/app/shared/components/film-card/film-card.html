@let f = film();

<article class="film-card">
  <div class="film-card__header">
    <app-favorite-toggle class="film-card__favorite-toggle" [isFavorite]="f.isFavorite"
      (favoriteToggled)="toggleFavorite()" />
    <span class="film-card__rating">{{f.rating}}</span>
  </div>
  <div class="film-card__wrapper" [routerLink]="[filmsPath, f.id]">
    <div class="film-card__thumb">
      <img [src]=" f.posterUrl" [alt]="f.title" loading="lazy">
    </div>
    <div class="film-card__info">
      <h3 class="film-card__title">{{f.title}}</h3>
      <p>{{f.year}} • {{f.genre}}</p>
    </div>
  </div>
</article>
