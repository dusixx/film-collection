@let f = film();

<article class="film-card" [routerLink]="['/films', f.id]">
  <div class="film-card__header">
    <button class="film-card__btn" type="button" [title]="f.isFavorite ? 'remove from favorites' : 'add to favorites'"
      (click)="handleFavoriteToggle($event)">{{f.isFavorite ? '💙' :
      '🤍'}}</button>
    <span class="film-card__rating" (click)="$event.stopPropagation()">{{f.rating}}</span>
  </div>
  <div class="film-card__wrapper">
    <div class="film-card__thumb">
      <img [src]=" f.posterUrl" [alt]="f.title" loading="lazy">
    </div>
    <div class="film-card__info">
      <h3 class="film-card__title">{{f.title}}</h3>
      <p>{{f.year}} • {{f.genre}}</p>
    </div>
  </div>
</article>
